<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sürprizini Hazırla 🎁</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #fff0f3; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; margin: 0; }
        .heart { position: absolute; color: #ff85a1; font-size: 20px; opacity: 0.5; pointer-events: none; animation: float linear infinite; z-index: 1; }
        @keyframes float { 0% { transform: translateY(100vh) rotate(0deg); } 100% { transform: translateY(-10vh) rotate(360deg); } }
        .container { background-color: white; padding: 40px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%; z-index: 10; position: relative; }
        h1 { color: #d62828; margin-bottom: 5px; font-size: 26px; }
        .sub-text { color: #777; margin-bottom: 25px; font-size: 14px; }
        .form-group { margin-bottom: 18px; text-align: left; }
        label { font-weight: 600; color: #444; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 2px solid #ffccd5; border-radius: 15px; margin-top: 5px; box-sizing: border-box; outline: none; }
        button { padding: 15px 40px; font-size: 18px; border: none; border-radius: 30px; cursor: pointer; transition: 0.3s; width: 100%; font-weight: bold; background-color: #ff4d6d; color: white; margin-top: 10px; }
        #shareBox { margin-top: 25px; padding: 15px; background: #fffafb; border-radius: 15px; display: none; }
    </style>
</head>
<body>

    <div id="creatorPanel" class="container">
        <h1>Sürprizini Hazırla</h1>
        <p class="sub-text">Ona hayır diyemeyeceği bir soru sor ✨</p>
        
        <div class="form-group">
            <label>Sevgilinin / Crush'ın İsmi:</label>
            <input type="text" id="tName" placeholder="Örn: Buse, Can...">
        </div>
        <div class="form-group">
            <label>Ne Sormak İstiyorsun?:</label>
            <input type="text" id="tQues" placeholder="Örn: Akşam yemeğe ne dersin? 🍝">
        </div>
        <div class="form-group">
            <label>Evet Derse Ne Söylemek İstersin?:</label>
            <input type="text" id="tAns" placeholder="Örn: Harika! Akşam 8'de seni alıyorum. 😍">
        </div>
        
        <button id="genBtn">Linki Oluştur</button>
        
        <div id="shareBox">
            <p>Link hazır, kopyalayıp gönder!</p>
            <strong id="finalLink" style="color: #d62828; word-break: break-all;"></strong>
        </div>
    </div>

    <div id="surprisePanel" class="container" style="display: none;">
        <h1 id="qDisplay"></h1>
        <div style="display: flex; gap: 15px; justify-content: center; margin-top: 20px;">
            <button id="yesBtn" style="width: auto; background: #58b970;">Evet</button>
            <button id="noBtn" style="width: auto; background: #ef476f; position: absolute;">Hayır</button>
        </div>
    </div>

    <script>
        function createHeart() {
            const h = document.createElement('div'); h.classList.add('heart'); h.innerHTML = '❤️';
            h.style.left = Math.random() * 100 + 'vw';
            h.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.body.appendChild(h); setTimeout(() => h.remove(), 6000);
        }
        setInterval(createHeart, 80);

        const params = new URLSearchParams(window.location.search);
        if (params.get('isim')) {
            document.getElementById('creatorPanel').style.display = 'none';
            document.getElementById('surprisePanel').style.display = 'block';
            document.getElementById('qDisplay').innerText = `${decodeURIComponent(params.get('isim'))}, ${decodeURIComponent(params.get('soru'))}`;
        }

        document.getElementById('genBtn').onclick = () => {
            const link = `${window.location.origin}${window.location.pathname}?isim=${encodeURIComponent(document.getElementById('tName').value)}&soru=${encodeURIComponent(document.getElementById('tQues').value)}&cevap=${encodeURIComponent(document.getElementById('tAns').value)}`;
            document.getElementById('finalLink').innerText = link;
            document.getElementById('shareBox').style.display = 'block';
            navigator.clipboard.writeText(link);
        };

        document.getElementById('yesBtn').onclick = () => {
            document.getElementById('surprisePanel').innerHTML = `<h1 style="font-size: 32px;">${decodeURIComponent(params.get('cevap'))}</h1>`;
        };

        const noBtn = document.getElementById('noBtn');
        noBtn.onmouseover = () => {
            noBtn.style.top = Math.random() * (window.innerHeight - 60) + 'px';
            noBtn.style.left = Math.random() * (window.innerWidth - 100) + 'px';
        };
    </script>
</body>
</html>
