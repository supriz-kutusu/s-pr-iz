<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sana Özel Bir Sürprizim Var! 🎁</title>
    <style>
        body { font-family: sans-serif; background-color: #fff0f3; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: white; padding: 40px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; max-width: 400px; width: 90%; }
        h1 { color: #d62828; margin-bottom: 30px; font-size: 24px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        input { width: 100%; padding: 12px; border: 2px solid #ffccd5; border-radius: 15px; margin-top: 5px; box-sizing: border-box; }
        button { padding: 15px 40px; font-size: 18px; border: none; border-radius: 30px; cursor: pointer; transition: 0.3s; width: 100%; font-weight: bold; background-color: #ff4d6d; color: white; }
        #shareBox { margin-top: 25px; padding: 15px; background: #fffafb; border-radius: 15px; display: none; }
        #yesBtn { background-color: #58b970; color: white; }
        #noBtn { background-color: #ef476f; color: white; }
    </style>
</head>
<body>

    <div id="creatorPanel" class="container">
        <h1>✨ Sürprizini Hazırla</h1>
        <div class="form-group"><label>İsim:</label><input type="text" id="tName" placeholder="Örn: Buse"></div>
        <div class="form-group"><label>Büyük Soru:</label><input type="text" id="tQues" placeholder="Örn: Benimle kahve içer misin?"></div>
        <div class="form-group"><label>Evet Cevabı:</label><input type="text" id="tAns" placeholder="Örn: Çok mutlu oldum! 😊"></div>
        <button id="genBtn">Linki Oluştur</button>
        <div id="shareBox">
            <p>Link kopyalandı, gönder!</p>
            <strong id="finalLink" style="color: #d62828; word-break: break-all;"></strong>
        </div>
    </div>

    <div id="surprisePanel" class="container" style="display: none;">
        <h1 id="qDisplay"></h1>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button id="yesBtn" style="width: auto;">Evet</button>
            <button id="noBtn" style="width: auto;">Hayır</button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        
        // Eğer linkten gelindiyse sürprizi göster
        if (params.get('isim')) {
            document.getElementById('creatorPanel').style.display = 'none';
            document.getElementById('surprisePanel').style.display = 'block';
            document.getElementById('qDisplay').innerText = `${decodeURIComponent(params.get('isim'))}, ${decodeURIComponent(params.get('soru'))}`;
        }

        // Link oluşturma
        document.getElementById('genBtn').onclick = () => {
            const link = `${window.location.origin}${window.location.pathname}?isim=${encodeURIComponent(document.getElementById('tName').value)}&soru=${encodeURIComponent(document.getElementById('tQues').value)}&cevap=${encodeURIComponent(document.getElementById('tAns').value)}`;
            document.getElementById('finalLink').innerText = link;
            document.getElementById('shareBox').style.display = 'block';
            navigator.clipboard.writeText(link);
        };

        // Evet'e basınca özel cevabı göster
        document.getElementById('yesBtn').onclick = () => {
            document.getElementById('surprisePanel').innerHTML = `<h1 style="font-size: 32px;">${decodeURIComponent(params.get('cevap'))}</h1>`;
        };

        // Hayır butonu kaçma efekti
        const noBtn = document.getElementById('noBtn');
        noBtn.onmouseover = () => {
            noBtn.style.position = 'absolute';
            noBtn.style.top = Math.random() * (window.innerHeight - 50) + 'px';
            noBtn.style.left = Math.random() * (window.innerWidth - 100) + 'px';
        };
    </script>
</body>
</html>
