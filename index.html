<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Özel Bir Sürprizim Var! 🎁</title>
    <meta property="og:title" content="Sana Özel Bir Sürprizim Var! 🎁">
    <meta property="og:description" content="Senin için bir şey hazırladım, bakmak ister misin? 💕">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: #ffe6e6; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; position: relative; }
        .heart { position: absolute; color: #ff4d6d; font-size: 20px; opacity: 0.6; animation: float 4s linear infinite; pointer-events: none; }
        @keyframes float { 0% { transform: translateY(100vh); opacity: 0.6; } 100% { transform: translateY(-10vh); opacity: 0; } }
        .container { background-color: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%; z-index: 10; }
        h1 { color: #ff4d6d; margin-bottom: 25px; font-size: 22px; }
        .btn-container { display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: 20px; position: relative; min-height: 140px; }
        button { padding: 12px 35px; font-size: 18px; font-weight: bold; border: none; border-radius: 25px; cursor: pointer; transition: all 0.2s ease; width: 160px; }
        #yesBtn { background-color: #4caf50; color: white; }
        #noBtn { background-color: #f44336; color: white; position: absolute; top: 70px; left: 50%; transform: translateX(-50%); z-index: 100; }
        .form-group { margin-bottom: 15px; text-align: left; }
        input { width: 100%; padding: 10px; border: 2px solid #ffccd5; border-radius: 10px; font-size: 16px; }
        .share-box { margin-top: 20px; padding: 15px; background: #fff0f3; border-radius: 10px; display: none; }
    </style>
</head>
<body>

    <div id="creatorPanel" class="container">
        <h1>✨ Sürpriz Ayarları</h1>
        <div class="form-group"><label>İsim:</label><input type="text" id="targetName"></div>
        <div class="form-group"><label>Soru:</label><input type="text" id="targetQuestion" value="Benimle konsere gelir misin? 🎸"></div>
        <div class="form-group"><label>Evet Cevabı:</label><input type="text" id="targetAnswer" value="Çok mutlu ettin beni! 💕"></div>
        <button id="generateBtn" style="width: 100%; background-color: #ff4d6d; color: white; padding: 10px;">Linki Üret</button>
        <div id="shareBox" class="share-box">
            <strong id="generatedLink" style="color: #d90429; font-size: 13px;"></strong>
            <button id="copyBtn" style="background-color: #ff4d6d; color: white; width: 100%; margin-top: 10px;">📋 Kopyala</button>
        </div>
    </div>

    <div id="surprisePanel" class="container" style="display: none;">
        <h1 id="questionText"></h1>
        <div class="btn-container">
            <button id="yesBtn">Evet</button>
            <button id="noBtn">Hayır</button>
        </div>
    </div>

    <script>
        function createHeart() {
            const h = document.createElement('div'); h.classList.add('heart'); h.innerHTML = '❤️';
            h.style.left = Math.random() * 100 + 'vw'; h.style.animationDuration = (Math.random() * 3 + 2) + 's';
            document.body.appendChild(h); setTimeout(() => h.remove(), 5000);
        }
        setInterval(createHeart, 300);

        const params = new URLSearchParams(window.location.search);
        if (params.get('isim')) {
            document.getElementById('creatorPanel').style.display = 'none';
            document.getElementById('surprisePanel').style.display = 'block';
            document.getElementById('questionText').innerHTML = `${decodeURIComponent(params.get('isim'))},<br><br>${decodeURIComponent(params.get('soru'))}`;
        }

        document.getElementById('generateBtn').addEventListener('click', () => {
            const n = encodeURIComponent(document.getElementById('targetName').value);
            const q = encodeURIComponent(document.getElementById('targetQuestion').value);
            const a = encodeURIComponent(document.getElementById('targetAnswer').value);
            const link = `${window.location.href.split('?')[0]}?isim=${n}&soru=${q}&cevap=${a}`;
            document.getElementById('generatedLink').innerText = link;
            document.getElementById('shareBox').style.display = 'block';
        });

        document.getElementById('copyBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(document.getElementById('generatedLink').innerText);
            alert('Kopyalandı!');
        });

        document.getElementById('yesBtn').addEventListener('click', () => {
            document.getElementById('surprisePanel').innerHTML = `<h1 style="font-size: 28px;">${decodeURIComponent(params.get('cevap') || 'Evet dedin!')}</h1>`;
        });

        const noBtn = document.getElementById('noBtn');
        noBtn.addEventListener('mouseenter', () => {
            noBtn.style.position = 'fixed';
            noBtn.style.top = Math.random() * (window.innerHeight - 50) + 'px';
            noBtn.style.left = Math.random() * (window.innerWidth - 100) + 'px';
        });
        noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); noBtn.style.top = Math.random() * 80 + '%'; noBtn.style.left = Math.random() * 80 + '%'; });
    </script>
</body>
</html>
